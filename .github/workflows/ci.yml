name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  kernel-and-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Kernel tests
        run: npm --workspace @ai-doctor/clinical-kernel run test
      - name: PWA tests (incl. i18n parity)
        run: npm --workspace @ai-doctor/pwa run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  a11y-and-budget:
    runs-on: ubuntu-latest
    needs: kernel-and-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install node
        run: npm ci
      - name: Install python test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
      - name: Perf budget drill
        run: pytest tests/test_perf_budget.py -q
      # a11y drill needs a browser; CI runner has Chrome preinstalled.
      - name: axe-core a11y drill
        run: pytest tests/test_a11y_axe.py -q
