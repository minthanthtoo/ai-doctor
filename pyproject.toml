[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-doctor-preclinical"
version = "0.1.0"
description = "Preclinical clinician-supervised clinical decision platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9"
]

[project.scripts]
ai-doctor-api = "ai_doctor.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_doctor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
ignore = ["B008"]  # FastAPI dependency injection intentionally uses Depends defaults.
